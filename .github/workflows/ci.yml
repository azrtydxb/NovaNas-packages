name: ci

# Standard azrtydxb PR CI. This repo holds scripts/manifests and had no
# pull-request checks; this gate validates every YAML/JSON manifest parses.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate manifests
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, json, sys, yaml
          bad = 0
          for pat, kind in (("**/*.yaml", "yaml"), ("**/*.yml", "yaml"), ("**/*.json", "json")):
              for f in glob.glob(pat, recursive=True):
                  if "/.git/" in f:
                      continue
                  try:
                      if kind == "yaml":
                          list(yaml.safe_load_all(open(f)))
                      else:
                          json.load(open(f))
                  except Exception as e:
                      print(f"{f}: {e}")
                      bad = 1
          sys.exit(bad)
          PY
