apiVersion: novanas.io/v1
kind: Plugin
metadata:
  name: object-storage
  version: 1.0.0
  vendor: novanas.io
spec:
  description: "S3-compatible object storage powered by RustFS, federated to Keycloak SSO and backed by ZFS."
  category: storage
  icon: icon.svg

  deployment:
    type: systemd
    unit: rustfs.service

  needs:
    - kind: dataset
      dataset:
        pool: tank
        name: objects
        properties:
          recordsize: "1M"
          atime: "off"
          compression: lz4
          xattr: sa
    - kind: tlsCert
      tlsCert:
        commonName: rustfs.novanas.local
        dnsNames:
          - rustfs.novanas.local
          - novanas.local
        ips:
          - "127.0.0.1"
        ttlDays: 825
    - kind: oidcClient
      oidcClient:
        clientId: rustfs
        redirectUris:
          - "https://novanas.local:9001/rustfs/console/oauth_callback"
        public: false
    - kind: permission
      permission:
        role: nova-operator
        description: "Object-storage plugin service account inherits operator role for nova-api callbacks."

  api:
    routes:
      # Admin / management surface only — proxied through nova-api so the
      # Aurora window can call it with the operator's session JWT. The
      # native S3 API stays on port 9000 and is hit DIRECTLY by AWS CLI /
      # boto / mc clients.
      - path: /admin/
        upstream: https://127.0.0.1:9001/rustfs/admin/
        auth: bearer-passthrough
        scopes:
          - PermPluginsRead

  ui:
    window:
      name: "Object Storage"
      icon: cloud
      route: /apps/object-storage
      bundle: main.js

  health:
    path: /admin/healthz
    intervalSeconds: 30
    timeoutSeconds: 5
